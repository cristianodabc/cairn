name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to publish, without the v prefix
        required: true
        type: string

permissions:
  contents: write
  pull-requests: read

env:
  ELIXIR_VERSION: "1.19.5"
  OTP_VERSION: "28.4.1"
  VERSION: ${{ inputs.version }}

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Elixir
        uses: ./.github/actions/setup-elixir
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}

      - name: Check input
        run: |
          if [ "${GITHUB_REF_NAME}" != "main" ]; then
            echo "Run releases from main"
            exit 1
          fi

          if ! echo "${VERSION}" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "Version must be bare SemVer, for example 1.2.3"
            exit 1
          fi

      - name: Check existing release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch --tags origin
          echo "RECOVER_EXISTING_TAG=false" >> "${GITHUB_ENV}"
          echo "GITHUB_RELEASE_EXISTS=false" >> "${GITHUB_ENV}"

          if mix hex.info cairn | grep -Eq "^  ${VERSION} "; then
            echo "Hex package cairn ${VERSION} already exists"
            echo "Version ${VERSION} has already been published to Hex. Choose the next version."
            exit 1
          fi

          if git rev-parse "v${VERSION}" >/dev/null 2>&1; then
            echo "Tag v${VERSION} already exists"
            tag_version="$(git show "v${VERSION}:mix.exs" | sed -n 's/.*version: "\([^"]*\)".*/\1/p' | head -n 1)"

            if [ "${tag_version}" != "${VERSION}" ]; then
              echo "Tag v${VERSION} points to mix.exs version ${tag_version}, not ${VERSION}"
              exit 1
            fi

            echo "RECOVER_EXISTING_TAG=true" >> "${GITHUB_ENV}"
          fi

          if gh release view "v${VERSION}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "GitHub release v${VERSION} already exists"
            echo "GITHUB_RELEASE_EXISTS=true" >> "${GITHUB_ENV}"

            if ! git rev-parse "v${VERSION}" >/dev/null 2>&1; then
              echo "GitHub release v${VERSION} exists, but tag v${VERSION} was not found"
              exit 1
            fi
          fi

      - name: Generate release notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          target_commitish="${GITHUB_SHA}"

          if [ "${RECOVER_EXISTING_TAG}" = "true" ]; then
            target_commitish="v${VERSION}"
            previous_tag="$(git tag --sort=-creatordate --merged "v${VERSION}" --list 'v*' | grep -v "^v${VERSION}$" | head -n 1)"
          else
            previous_tag="$(git describe --tags --abbrev=0 --match 'v*' 2>/dev/null || true)"
          fi

          if [ -n "${previous_tag}" ]; then
            gh api "repos/${GITHUB_REPOSITORY}/releases/generate-notes" \
              -f "tag_name=v${VERSION}" \
              -f "target_commitish=${target_commitish}" \
              -f "previous_tag_name=${previous_tag}" \
              --jq .body > RELEASE_NOTES.md
          else
            gh api "repos/${GITHUB_REPOSITORY}/releases/generate-notes" \
              -f "tag_name=v${VERSION}" \
              -f "target_commitish=${target_commitish}" \
              --jq .body > RELEASE_NOTES.md
          fi

      - name: Update release files
        if: env.RECOVER_EXISTING_TAG != 'true'
        run: |
          mix run -e '
          version = System.fetch_env!("VERSION")
          date = Date.utc_today() |> Date.to_iso8601()
          notes = File.read!("RELEASE_NOTES.md") |> String.trim()

          update = fn file, pattern, replacement ->
            body = File.read!(file)
            next = Regex.replace(pattern, body, replacement, global: false)

            if body == next do
              Mix.raise("could not update #{file}")
            end

            File.write!(file, next)
          end

          update.("mix.exs", ~r/version: "[^"]+"/, ~s(version: "#{version}"))
          update.("README.md", ~r/{:cairn, "~> [^"]+"}/, ~s({:cairn, "~> #{version}"}))

          heading = "## v#{version} - #{date}"
          entry = "#{heading}\n\n#{notes}\n\n"

          changelog =
            if File.exists?("CHANGELOG.md") do
              File.read!("CHANGELOG.md")
            else
              "# Changelog\n\n"
            end

          File.write!("CHANGELOG.md", Regex.replace(~r/\A# Changelog\n\n/, changelog, "# Changelog\n\n#{entry}", global: false))
          '

      - name: Checkout existing tag
        if: env.RECOVER_EXISTING_TAG == 'true'
        run: |
          git checkout "v${VERSION}"
          mix deps.get

      - name: Run quality checks
        run: mix quality

      - name: Build package
        run: mix hex.build

      - name: Commit release files
        if: env.RECOVER_EXISTING_TAG != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mix.exs README.md CHANGELOG.md
          git commit -m "chore(release): v${VERSION}"
          git push origin HEAD:main

      - name: Publish package
        env:
          HEX_API_KEY: ${{ secrets.HEX_API_KEY }}
        run: |
          if [ -z "${HEX_API_KEY}" ]; then
            echo "HEX_API_KEY is not configured"
            exit 1
          fi

          mix hex.publish --yes

      - name: Tag release
        if: env.RECOVER_EXISTING_TAG != 'true'
        run: |
          git tag -a "v${VERSION}" -m "v${VERSION}"
          git push origin "v${VERSION}"

      - name: Create GitHub release
        if: env.GITHUB_RELEASE_EXISTS != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${VERSION}" \
            --title "v${VERSION}" \
            --notes-file RELEASE_NOTES.md
